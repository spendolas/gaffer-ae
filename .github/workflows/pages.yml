name: Deploy landing page

# Publishes only site/ (never docs/ or the rest of the repo) to GitHub Pages at gafferae.com.
# Needs Settings > Pages > Source: GitHub Actions, and the custom domain gafferae.com (see site/CNAME).

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/site/**'
      - 'README.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # ffmpeg (with ffprobe) makes the poster for any clip that has no hand-made one.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # Before the tests: some of them read the generated site/items.json.
      - name: Build the clip manifest and posters
        run: node scripts/site/build-manifest.mjs

      - name: Site tests
        run: node --test scripts/site/

      - name: Boot variables match the config defaults
        run: node scripts/site/sync-boot-vars.mjs --check

      - name: install.md matches the README
        run: node scripts/site/build-install-md.mjs --check

      - name: Build the sitemap
        run: node scripts/site/build-sitemap.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # upload-pages-artifact may drop dot-folders; fail loudly if security.txt did not ship.
      - name: Check security.txt is served
        run: curl -fsS "${{ steps.deployment.outputs.page_url }}.well-known/security.txt" | grep -q '^Contact:'
