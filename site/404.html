<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Page not found</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#121212">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <style>
    /* Absolute paths: GitHub Pages serves this file for any unknown URL, at any depth. */
    @font-face {
      font-family: 'Source Sans 3';
      src: url('/fonts/SourceSans3VF-Upright.otf.woff2') format('woff2');
      font-weight: 200 900;
      font-style: normal;
      font-display: swap;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background: #121212;
      color: #E0E0E0;
      font-family: 'Source Sans 3', 'Segoe UI', system-ui, sans-serif;
      text-align: center;
    }
    main { max-width: 32rem; }
    h1 { margin: 0; font-size: clamp(3rem, 14vw, 6rem); font-weight: 500; letter-spacing: -0.03em; line-height: 0.9; }
    p { margin: 1rem 0 1.75rem; font-size: 1.125rem; color: #AAAAAA; }
    a {
      display: inline-block;
      padding: 0.625rem 1.25rem;
      border-radius: 999px;
      background: #4475C0;
      color: #FFFFFF;
      font-size: 1rem;
      font-weight: 500;
      text-decoration: none;
    }
    a:hover { background: #3C68AA; }
    a:focus-visible { outline: 2px solid #E0E0E0; outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <h1>Gaffer</h1>
    <p>That page does not exist.</p>
    <a href="/">Back to the grid</a>
  </main>
</body>
</html>
