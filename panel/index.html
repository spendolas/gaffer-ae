<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Gaffer</title>
  <style>
    /* Adobe Clean — licensed, local-only (panel/fonts/ is gitignored).
       Missing files fall back silently to the stack on body. */
    @font-face { font-family: "Adobe Clean"; src: url("fonts/AdobeClean-Regular.otf") format("opentype"); font-weight: 400; font-style: normal; }
    @font-face { font-family: "Adobe Clean"; src: url("fonts/AdobeClean-It.otf") format("opentype"); font-weight: 400; font-style: italic; }
    @font-face { font-family: "Adobe Clean"; src: url("fonts/AdobeClean-Bold.otf") format("opentype"); font-weight: 700; font-style: normal; }
    @font-face { font-family: "Adobe Clean"; src: url("fonts/AdobeClean-ExtraBold.otf") format("opentype"); font-weight: 800; font-style: normal; }
    @font-face { font-family: "Adobe Clean SemiCondensed"; src: url("fonts/AdobeClean-BoldSemiCn.otf") format("opentype"); font-weight: 700; font-style: normal; }

    /* Design tokens — generated from design/tokens.json (Figma "Gaffer"
       collection). Edit there, not here; see docs/figma-parity-audit.md §3. */
    :root {
      --color-bg-panel: #232323;
      --color-bg-input: #121212;
      --color-bg-banner: #173658;
      /* fader's transparent knot — always the same hex as bg-panel at
         alpha 0; both re-derived together from AppSkinInfo in JS */
      --color-bg-panel-0: rgba(35, 35, 35, 0);
      --color-border-default: #333333;
      --color-border-input: #444444;
      --color-border-banner: #5876b2;
      --color-text-default: #e0e0e0;
      --color-text-strong: #fafafa;
      --color-text-light: #dddddd;
      --color-text-light-2: #cccccc;
      --color-text-muted: #aaaaaa;
      --color-text-dimmer: #888888;
      --color-text-dim: #777777;
      --color-text-dimmest: #666666;
      --color-text-hint: #555555;
      --color-text-white: #ffffff;
      --color-text-code: #efaa3c;
      --color-accent-blue: #4d9df7;
      --color-accent-red: #cc4444;
      --color-accent-green: #3dc17f;
      --color-accent-amber: #d09726;
      --color-bubble-user-bg: #000000;
      --color-bubble-assistant-bg: rgba(18, 18, 18, 0);
      --color-bubble-assistant-border: #3a3a3a;
      --color-pill-running: #3a3520;
      --color-pill-done: #1a3520;
      --color-pill-error: #3a2020;
      --color-btn-primary-bg: #4a7dc9;
      --color-btn-primary-hover: #4a6a9a;
      --color-btn-danger-bg: #ec4848;
      --color-btn-danger-hover: #9a4a4a;
      --color-btn-icon-bg: rgba(0, 0, 0, 0.7);
      --color-overlay-drop: rgba(35, 60, 100, 0.95);
      --color-overlay-lightbox: rgba(0, 0, 0, 0.95);
      --color-bg-table-row: rgba(0, 0, 0, 0.2);
      /* Unbound in Figma — proposed tokens (audit §3) */
      --color-bubble-error-bg: rgba(204, 68, 68, 0.5);
      --color-bubble-error-text: #ee8888;
      --color-code-inline-bg: rgba(216, 176, 112, 0.2);
      --color-code-block-text: #d8d8d8;
      --color-mcp-tile-glyph: #e8eefa;
      --color-text-placeholder: rgba(119, 119, 119, 0.5);
      /* Space + radius scale */
      --space-2: 2px; --space-4: 4px; --space-6: 6px; --space-8: 8px;
      --space-12: 12px; --space-16: 16px;
      --radius-2: 2px; --radius-4: 4px; --radius-6: 6px; --radius-8: 8px;
      --radius-16: 16px; --radius-full: 999px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: "Adobe Clean", "Segoe UI", sans-serif;
      font-size: 14px;
      background: var(--color-bg-panel);
      color: var(--color-text-default);
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    /* LED atom: 8x8 layout slot, 12x12 star overflowing 2px each side */
    .led {
      position: relative;
      width: 8px;
      height: 8px;
      color: var(--color-accent-red);
      transition: color 0.3s;
    }
    .led svg {
      position: absolute;
      top: -2px;
      left: -2px;
      width: 12px;
      height: 12px;
    }
    .led.connected { color: var(--color-accent-green); }
    .led.starting { color: var(--color-accent-amber); }
    .gicon {
      display: inline-block;
      width: 16px;
      height: 16px;
      vertical-align: middle;
    }
    .gicon svg { display: block; width: 100%; height: 100%; }

    /* Chat */
    .chat-messages {
      flex: 1;
      overflow-y: scroll;
      /* Chat runs behind the input section down to the fader's solid
         edge (26px into the input row); extra bottom padding lets
         content scroll clear. --input-h/--row-h kept live from JS. */
      margin-bottom: calc(-1 * (var(--input-h, 52px) - var(--row-h, 48px) + 24px));
      padding: 8px 12px calc(var(--input-h, 52px) - var(--row-h, 48px) + 32px);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    /* Scrollbar stops at the input section's top edge — inset the track
       by the full bleed the chat box runs behind it */
    .chat-messages::-webkit-scrollbar-track {
      margin-bottom: calc(var(--input-h, 52px) - var(--row-h, 48px) + 24px);
    }
    /* Global thin scrollbars (audit §1.5) — chat log, textarea, code
       blocks, MCP tiles row all inherit */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: var(--color-border-input);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover { background: var(--color-text-hint); }
    ::-webkit-scrollbar-corner { background: transparent; }
    /* Bubbles — Figma Bubble set 183:1055. Children stack with gap 12;
       flex `order` keeps copy/typing at the bottom regardless of DOM order. */
    .chat-msg {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 8px;
      border-radius: 16px;
      max-width: 95%;
      font-size: 14px;
      line-height: 18px;
      white-space: pre-wrap;
      word-wrap: break-word;
      user-select: text;
      -webkit-user-select: text;
      cursor: text;
    }
    .chat-msg .msg-text,
    .chat-msg > div:not(.bubble-images-row) { padding: 0 4px; }
    .chat-msg.user {
      background: var(--color-bubble-user-bg);
      border-radius: 16px 16px 2px 16px;
      align-self: flex-end;
      color: var(--color-text-light);
    }
    .chat-msg.assistant {
      background: transparent;
      border-radius: 16px 16px 16px 2px;
      /* row-assistant fills with 80px reserved on the right (Figma update) */
      align-self: stretch;
      margin-right: 40px;
      color: var(--color-text-light-2);
    }
    .chat-msg.error {
      background: var(--color-bubble-error-bg);
      border-radius: 16px;
      color: var(--color-bubble-error-text);
    }
    /* copy is the same Icon/Informed button atom as Clear/Reload —
       shares .icon-btn; this only positions it inside the bubble */
    .copy-btn {
      order: 9;
      align-self: flex-start;
    }

    /* Markdown rendering inside chat messages. white-space: normal —
       the bubble's pre-wrap would render marked's inter-block newlines
       as extra blank lines; <pre> keeps its own whitespace. */
    .msg-text { display: block; white-space: normal; }
    .msg-text h1, .msg-text h2, .msg-text h3, .msg-text h4 {
      font-weight: 700; /* real Bold face — 600 doesn't exist in Adobe Clean */
      margin: 8px 0 4px 0;
      color: var(--color-text-strong);
      line-height: 1.3;
    }
    .msg-text h1 { font-size: 16px; }
    .msg-text h2 { font-size: 14px; }
    .msg-text h3 { font-size: 13px; }
    .msg-text h4 { font-size: 12px; color: var(--color-text-light); }
    .msg-text p { margin: 12px 0; }
    .msg-text p:first-child { margin-top: 0; }
    .msg-text p:last-child { margin-bottom: 0; }
    .msg-text p:empty { display: none; }
    .msg-text br + br { display: none; }
    .msg-text strong { color: var(--color-text-strong); font-weight: 700; }
    .msg-text em { color: var(--color-text-light); font-style: italic; }
    .msg-text ul, .msg-text ol { margin: 2px 0 2px 18px; padding: 0; font-size: 0; }
    .msg-text li { margin: 0; font-size: 14px; line-height: 18px; display: list-item; }
    .msg-text li > p { margin: 0; display: inline; }
    .msg-text li + li { margin-top: 2px; }
    .msg-text p + ul, .msg-text p + ol { margin-top: 0; }
    .msg-text ul + p, .msg-text ol + p { margin-top: 6px; }
    /* CodeInline 185:1156 — pad 2/4, r4, 20h chip. display:inline so the
       vertical padding paints outside the line box: the 18px body line
       rhythm stays untouched (the chip bleeds 1px past the line, by design). */
    .msg-text code {
      background: var(--color-code-inline-bg);
      border: none;
      border-radius: 4px;
      padding: 2px 4px;
      font-family: "SF Mono", "Consolas", monospace;
      font-size: 12px;
      /* pin below the body's 18px: SF Mono's baseline split at an
         inherited 18px pushes mixed lines to ~19px */
      line-height: 16px;
      color: var(--color-text-code);
    }
    .msg-text pre {
      background: var(--color-bg-input);
      border: none;
      border-radius: 8px;
      padding: 4px 8px;
      margin: 6px 0;
      overflow-x: auto;
    }
    .msg-text pre code {
      background: transparent;
      border: 0;
      padding: 0;
      color: var(--color-code-block-text);
      font-size: 12px;
      line-height: 16px;
    }
    .msg-text blockquote {
      border-left: 2px solid var(--color-text-hint);
      padding-left: 8px;
      margin: 4px 0;
      color: var(--color-text-muted);
    }
    .msg-text a { color: var(--color-accent-blue); text-decoration: none; }
    .msg-text a:hover { text-decoration: underline; }
    /* Tables — Figma MarkdownTable 185:1166: r8 container on bg/input,
       zebra on odd data rows, panel-colored column dividers, no borders */
    .msg-text table {
      border-collapse: separate;
      border-spacing: 0;
      margin: 6px 0;
      font-size: 12px;
      line-height: 16px;
      width: 100%;
      background: var(--color-bg-input);
      border-radius: 8px;
      overflow: hidden;
    }
    .msg-text th, .msg-text td {
      border: none;
      border-right: 1px solid var(--color-bg-panel);
      padding: 4px 8px;
      text-align: left;
      color: var(--color-text-strong);
    }
    .msg-text th:last-child, .msg-text td:last-child { border-right: none; }
    .msg-text th { font-weight: 800; }
    .msg-text tbody tr:nth-child(odd) td { background: var(--color-bg-table-row); }
    .msg-text hr { border: 0; border-top: 1px solid var(--color-border-default); margin: 8px 0; }

    .tool-pills-row {
      order: 2;
      display: flex;
      flex-wrap: wrap;
      gap: 2px;
      padding: 0 4px;
    }
    .tool-pill {
      display: inline-block;
      font-size: 9px;
      line-height: 13.5px;
      padding: 1px 6px;
      border-radius: 8px;
      font-family: "SF Mono", "Consolas", monospace;
      background: var(--color-border-default);
      color: var(--color-text-muted);
    }
    @keyframes pillPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
    .tool-pill.running { background: var(--color-pill-running); color: var(--color-accent-amber); animation: pillPulse 1.5s ease-in-out infinite; }
    .tool-pill.done { background: var(--color-pill-done); color: var(--color-accent-green); }
    .tool-pill.error { background: var(--color-pill-error); color: var(--color-accent-red); }
    /* Three-dot typing indicator (Figma TypingIndicator 215:2620) */
    .typing-indicator {
      order: 8;
      display: inline-flex;
      gap: 2px;
      padding: 4px;
      color: var(--color-text-dimmest);
    }
    .typing-indicator i {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: currentColor;
      animation: typingBounce 1.2s ease-in-out infinite;
    }
    .typing-indicator i:nth-child(2) { animation-delay: 0.15s; }
    .typing-indicator i:nth-child(3) { animation-delay: 0.3s; }
    @keyframes typingBounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.35; }
      30% { transform: translateY(-3px); opacity: 1; }
    }
    .chat-notice {
      align-self: center;
      color: var(--color-text-dimmer);
      font-size: 11px;
      font-style: italic;
      padding: 4px 8px;
      max-width: 90%;
      text-align: center;
    }
    @keyframes blink { 50% { opacity: 0.3; } }
    .typing-dot { animation: blink 1s infinite; }

    /* Bubble image attachments */
    .bubble-images-row {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    /* hasImages bubble variant: bottom pad grows to 12 (both roles) */
    .chat-msg.has-images { padding-bottom: 12px; }
    /* BubbleImage 185:1130 — 280x180 r8; row gap 4 */
    .bubble-image {
      max-width: 280px;
      max-height: 180px;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 8px;
      cursor: zoom-in;
      display: block;
    }

    /* Input */
    /* InputArea — Figma 191:1273 / InputRow set 195:1429: pill field r24
       with the send/stop button embedded, bottom-anchored */
    .chat-input-area {
      position: relative; /* anchors the update-banner overlay */
      display: flex;
      gap: 0; /* InputArea itemSpacing 0 — paste tray docks flush on the pill */
      padding: 2px 6px;
      flex-shrink: 0;
      flex-direction: column;
    }
    /* Chat Fader 290:9686 — gradient anchored to the input row: solid
       panel-bg from 26px into the row, fading out over the 24px above
       its top (48px box at row-top -22). Sits above the banner (washing
       the pill bottom, per Figma) and below the row/tray (positioned). */
    .chat-input-area::before {
      content: '';
      position: absolute;
      left: 6px;
      right: 6px;
      bottom: calc(var(--row-h, 48px) - 24px);
      height: 48px;
      background: linear-gradient(to top, var(--color-bg-panel) 50%, var(--color-bg-panel-0) 100%);
      pointer-events: none;
    }
    .chat-input-row {
      position: relative; /* paints above the chat fader */
      display: flex;
      align-items: flex-end;
      gap: 6px;
      background: var(--color-bg-input);
      border-radius: 24px;
      padding: 8px;
    }
    /* PastePreviewRow 185:1163 — centered tray docked flush on the pill:
       bg/input fill, r 12/12/0/0, pad 4, gap 4. ImageChip 176:940 80x80 r8,
       CloseBtn 219:3708 16x16 r8 overhanging the corner by 6px; reverse
       z-order (earlier chip's X above the next chip) set inline in JS. */
    .paste-preview-row {
      position: relative; /* paints above the chat fader */
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      padding: 4px;
      margin: 4px 0; /* Preview Row Wrapper 290:9365 pad */
      align-self: center;
      background: var(--color-bg-input);
      border-radius: 12px; /* floats now — all corners */
    }
    .paste-preview-row:empty { display: none; }
    .paste-chip {
      position: relative;
      width: 80px;
      height: 80px;
      background: var(--color-bg-input);
    }
    .paste-chip img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border-radius: 8px;
      cursor: zoom-in;
    }
    .paste-chip-x {
      position: absolute;
      top: -6px;
      right: -6px;
      width: 16px;
      height: 16px;
      padding: 2px;
      border-radius: 8px;
      background: var(--color-btn-icon-bg);
      color: var(--color-text-light);
      cursor: pointer;
      user-select: none;
    }
    .paste-chip-x:hover { background: var(--color-accent-red); color: var(--color-text-white); }

    /* Drag-over hint and lightbox */
    /* DropOverlay 191:1275 — flat, no border; 'Drop here' above the icon */
    .drop-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--color-overlay-drop);
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
      justify-content: center;
      color: var(--color-border-banner);
      font-size: 10px;
      line-height: 15px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s;
      z-index: 1000;
    }
    .drop-overlay.visible { opacity: 1; }
    .img-lightbox {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--color-overlay-lightbox);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: zoom-out;
      z-index: 1100;
    }
    .img-lightbox[hidden] { display: none; }
    .img-lightbox img {
      max-width: 90vw;
      max-height: 90vh;
      width: auto;
      height: auto;
      border-radius: 8px;
      object-fit: contain;
    }
    .chat-input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--color-text-default);
      font-family: inherit;
      font-size: 14px;
      line-height: 18px;
      /* horizontal pad only + centered — vertical rhythm comes from the
         row's pad 8, keeping the pill at the designed 48px */
      padding: 0 8px;
      height: 18px;
      max-height: 144px; /* 8 lines x 18px */
      align-self: center;
      resize: none;
      outline: none;
      overflow-y: auto;
    }
    .chat-input::placeholder {
      color: var(--color-text-placeholder);
      font-style: italic;
    }
    .chat-input.offline::placeholder { font-style: normal; }
    /* Send/Stop — Button atom Type=Icon/Prompt: 32x32, r16, icon-only.
       State matrix (audit §4.2): offline = panel-colored no icon,
       empty = primary @0.4, typed = primary, busy = danger + stop. */
    .send-btn, .stop-btn {
      width: 32px;
      height: 32px;
      padding: 8px;
      border: none;
      border-radius: 16px;
      color: var(--color-text-light);
      cursor: pointer;
      flex-shrink: 0;
    }
    .send-btn .gicon, .stop-btn .gicon { width: 16px; height: 16px; display: block; }
    .send-btn { background: var(--color-btn-primary-bg); opacity: 0.4; }
    .send-btn.typed { opacity: 1; }
    .send-btn.offline { background: var(--color-bg-panel); }
    .send-btn.offline .gicon { visibility: hidden; }
    .send-btn:hover:not(:disabled):not(.offline) { background: var(--color-btn-primary-hover); opacity: 1; }
    .send-btn:disabled { opacity: 0.4; cursor: default; }
    .stop-btn { background: var(--color-btn-danger-bg); }
    .stop-btn:hover { background: var(--color-btn-danger-hover); }

    /* Activity log */
    /* ActivityLog — Figma set 191:1343: collapsed 40h / expanded 144h.
       Status+Clear+Reload sit LEFT, More/Less pinned RIGHT. */
    .activity-log {
      /* no divider — the design has zero strokes; separation is spatial */
      padding: 4px 0;
      flex-shrink: 0;
      font-size: 10px;
    }
    .activity-log summary {
      color: var(--color-text-dimmer);
      cursor: pointer;
      user-select: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 8px;
      line-height: 10px;
    }
    /* Status 241:2282 (updated): bare 24x24 square, star only — status
       reads from the star color; text lives in the tooltip */
    .activity-status {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .status-square {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .activity-more {
      display: inline-flex;
      align-items: center;
      color: var(--color-text-dimmer);
    }
    .icon-btn {
      width: 24px;
      height: 24px;
      padding: 4px;
      border: none;
      border-radius: 8px;
      background: var(--color-border-default);
      color: var(--color-text-dimmer);
      cursor: pointer;
    }
    .icon-btn .gicon { width: 16px; height: 16px; display: block; }
    .icon-btn:hover { color: var(--color-text-light-2); }
    /* Animated expand/collapse — native <details> can't transition, so
       the element stays open and .expanded drives the body height */
    .activity-body {
      overflow: hidden;
      max-height: 0;
      opacity: 0;
      transition: max-height 0.28s ease, opacity 0.2s ease;
    }
    .activity-log.expanded .activity-body { max-height: 240px; opacity: 1; }
    .activity-settings {
      padding: 6px 8px 4px 8px;
      display: flex;
      gap: 12px;
      align-items: center;
      font-size: 10px;
      line-height: 15px;
      color: var(--color-text-muted);
    }
    .activity-settings label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
    /* MCP tiles row (audit §4.6): 40h tiles, min 45w, equal-fill when few,
       horizontal scroll when many. Fill = state: blue enabled, none
       available, amber needs-auth, red failed. */
    .activity-mcps { padding: 4px 0 4px 0; min-height: 48px; }
    .mcp-tiles {
      flex: 1;
      display: flex;
      overflow-x: auto;
      align-items: stretch;
      min-width: 0;
    }
    .mcp-tiles::-webkit-scrollbar { display: none; } /* clean overflow, still scrolls */
    .mcp-loading { color: var(--color-text-dimmest); margin: auto; }
    .mcp-error { color: var(--color-accent-red); margin: auto; }
    .mcp-tile.fade-in {
      opacity: 0;
      animation: tileFade 0.35s ease-out forwards;
    }
    @keyframes tileFade { to { opacity: 1; } }
    .mcp-tile {
      flex: 1 0 45px;
      min-width: 45px;
      height: 40px;
      border: none;
      padding: 0;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--color-mcp-tile-glyph);
      transition: background-color 0.25s ease, filter 0.15s ease;
    }
    .mcp-tile.enabled { background: var(--color-accent-blue); }
    .mcp-tile.auth { background: var(--color-accent-amber); }
    .mcp-tile.failed { background: var(--color-accent-red); cursor: default; }
    .mcp-tile.enabled:hover, .mcp-tile.auth:hover { filter: brightness(1.15); }
    .mcp-tile.available:hover { background: var(--color-border-default); }
    .mcp-tile.authing { animation: pillPulse 1.5s ease-in-out infinite; }
    .mcp-tile img {
      width: 18px;
      height: 18px;
      object-fit: contain;
      /* fallback for favicons without alpha (can't be masked) */
      filter: grayscale(1) brightness(1.9);
    }
    /* alpha-bg favicons render as flat single-color glyphs via mask */
    .mcp-tile .mask-glyph {
      width: 18px;
      height: 18px;
      background: currentColor;
      -webkit-mask-position: center;
      -webkit-mask-size: contain;
      -webkit-mask-repeat: no-repeat;
    }
    .mcp-tile .gicon { width: 20px; height: 20px; }
    .mcp-tooltip {
      position: fixed;
      z-index: 200;
      padding: 3px 8px;
      border-radius: 6px;
      background: var(--color-btn-icon-bg);
      color: var(--color-text-light);
      font-size: 10px;
      line-height: 15px;
      pointer-events: none;
      white-space: nowrap;
    }
    .mcp-tile .monogram {
      font-family: "Adobe Clean SemiCondensed", "Adobe Clean", sans-serif;
      font-weight: 700;
      font-size: 16px;
      line-height: 16px;
    }
    .row-label { color: var(--color-text-dimmer); }
    .spacer { flex: 1; }
    #versionText { color: var(--color-text-dimmest); }
    /* ModelSelect atom — closed 20h r8 on border/input; popup r8 pad 2,
       options 20h, selected on btn/primary r6 */
    .select-wrap { position: relative; display: flex; flex: 1; }
    .select-btn {
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 2px;
      flex: 1;
      min-width: 0;
      height: 20px;
      padding: 2px 4px 2px 8px;
      border: none;
      border-radius: 8px;
      background: var(--color-border-input);
      color: var(--color-text-light-2);
      font-size: 10px;
      line-height: 10px;
      cursor: pointer;
    }
    .select-btn:disabled { opacity: 0.4; cursor: default; }
    .select-btn::after {
      content: "";
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      background: currentColor;
      -webkit-mask: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none"><path d="M5 6.5l3 3 3-3" stroke="black" stroke-linecap="round" stroke-linejoin="round"/></svg>') center / contain no-repeat;
    }
    .select-popup {
      position: absolute;
      bottom: calc(100% + 2px);
      left: 0;
      min-width: 100%;
      padding: 2px;
      border-radius: 8px;
      background: var(--color-border-input);
      z-index: 50;
    }
    .select-popup .option {
      display: block;
      padding: 5px 6px;
      border-radius: 6px;
      color: var(--color-text-light-2);
      cursor: pointer;
      white-space: nowrap;
    }
    .select-popup .option:hover { background: var(--color-btn-primary-hover); }
    .select-popup .option.selected { background: var(--color-btn-primary-bg); }
    /* Toggle atom — 24x12 r16 track, 12x8 r4 knob */
    .toggle-label { color: var(--color-text-dimmer); }
    .toggle-label input { display: none; }
    .toggle {
      display: inline-block;
      width: 24px;
      height: 12px;
      padding: 2px;
      border-radius: 16px;
      background: var(--color-bg-input);
      transition: background 0.15s;
    }
    .toggle .knob {
      display: block;
      width: 12px;
      height: 8px;
      border-radius: 4px;
      background: var(--color-text-dimmest);
      transition: transform 0.15s, background 0.15s;
    }
    .toggle-label input:checked + .toggle { background: var(--color-accent-blue); }
    .toggle-label input:checked + .toggle .knob {
      background: var(--color-text-light);
      transform: translateX(8px);
    }
    .text-btn {
      height: 20px;
      padding: 2px 8px;
      border: none;
      border-radius: 8px;
      background: var(--color-border-input);
      color: var(--color-text-light-2);
      font-size: 10px;
      line-height: 10px;
      cursor: pointer;
    }
    .model-select {
      background: var(--color-bg-input);
      border: 1px solid var(--color-border-input);
      color: var(--color-text-light);
      font-size: 10px;
      padding: 1px 4px;
      border-radius: 3px;
      cursor: pointer;
    }
    /* UpdateBanner 191:1271 — hidden overlay pill docked flush above the
       input area, overlapping the chat bottom; no shadow (flat design) */
    /* UpdateBanner 290:8929 — in-flow between the preview tray and the
       input row; pill docks flush on the pill row (r 16/16/0/0), its
       bottom washed by the chat fader per the Figma render */
    .update-banner {
      display: none;
      justify-content: center;
      padding: 0 6px;
    }
    .update-banner.visible { display: flex; }
    .banner-pill {
      display: flex;
      align-items: center;
      gap: 40px;
      padding: 6px 6px 6px 12px;
      background: var(--color-bg-banner);
      border-radius: 16px 16px 0 0;
    }
    .banner-text {
      font-size: 12px;
      line-height: 16px;
      padding-bottom: 2px; /* Text Wrapper compensate */
      color: var(--color-accent-blue);
    }
    .update-banner .actions { display: flex; align-items: center; gap: 4px; }
    #updateBtn {
      height: 20px;
      padding: 2px 8px;
      border: none;
      border-radius: 8px;
      background: var(--color-btn-primary-bg);
      color: var(--color-bg-panel);
      font-size: 10px;
      line-height: 10px;
      cursor: pointer;
    }
    #updateBtn:hover { background: var(--color-btn-primary-hover); }
    .banner-dismiss {
      width: 20px;
      height: 20px;
      padding: 2px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--color-btn-primary-bg);
      cursor: pointer;
    }
    .banner-dismiss .gicon { width: 16px; height: 16px; display: block; }
    .activity-log .value {
      font-family: "SF Mono", "Consolas", monospace;
      font-size: 10px;
      color: var(--color-text-dimmer);
      padding: 2px 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Uniform state-change animation on every interactive control.
       Late in the sheet so it wins same-specificity earlier transitions;
       .mcp-tile keeps its own tuned timing. */
    .send-btn, .stop-btn, .icon-btn, .text-btn, .model-select,
    .select-popup .option, .toggle, .toggle .knob,
    #updateBtn, .banner-dismiss, .paste-chip-x, .activity-log summary {
      transition: background-color 0.15s ease, color 0.15s ease,
                  border-color 0.15s ease, opacity 0.15s ease,
                  transform 0.15s ease, filter 0.15s ease;
    }
  </style>
</head>
<body>
  <div id="chatMessages" class="chat-messages"></div>

  <div class="chat-input-area">
    <div class="paste-preview-row" id="pastePreviewRow"></div>
    <div id="updateBanner" class="update-banner">
      <div class="banner-pill">
        <span id="updateText" class="banner-text">Update available</span>
        <span class="actions">
          <button id="updateBtn">Update</button>
          <button id="dismissUpdateBtn" class="banner-dismiss" title="Dismiss"></button>
        </span>
      </div>
    </div>
    <div class="chat-input-row">
      <textarea id="chatInput" class="chat-input" placeholder="Ask Gaffer..." rows="1" disabled></textarea>
      <button id="sendBtn" class="send-btn" title="Send" disabled></button>
      <button id="stopBtn" class="stop-btn" title="Stop"></button>
    </div>
  </div>

  <details class="activity-log" open>
    <summary>
      <span class="activity-status">
        <span id="statusWrap" class="status-square" title="Starting...">
          <span id="led" class="led"></span>
        </span>
        <button id="clearBtn" class="icon-btn" title="Clear chat"></button>
        <button id="reloadBtn" class="icon-btn" title="Reload panel"></button>
      </span>
      <span class="activity-more">
        <span id="moreLabel">More</span>
        <span id="moreChevron" class="gicon"></span>
      </span>
    </summary>
    <div class="activity-body">
    <div class="activity-settings activity-mcps">
      <div id="mcpList" class="mcp-tiles">
        <span class="mcp-loading">loading…</span>
      </div>
    </div>
    <div class="activity-settings">
      <span class="row-label">Model:</span>
      <span class="select-wrap">
        <button id="modelSelectBtn" class="select-btn"><span id="modelSelectLabel">Opus</span></button>
        <div id="modelSelectPopup" class="select-popup" hidden></div>
      </span>
      <button class="select-btn" disabled title="Model variant — plumbing pending"><span>Latest • 1M</span></button>
      <button class="select-btn" disabled title="Effort — plumbing pending"><span>High</span></button>
    </div>
    <div class="activity-settings">
      <span id="versionText">v—</span>
      <span class="spacer"></span>
      <label class="toggle-label">
        <input type="checkbox" id="autoCheckUpdates">
        <span class="toggle"><span class="knob"></span></span>
        Auto-check updates
      </label>
      <button id="checkNowBtn" class="text-btn">Check now</button>
    </div>
    <div id="lastJsx" class="value" hidden></div>
    <div id="lastResult" class="value" hidden></div>
    </div>
  </details>

  <div class="drop-overlay" id="dropOverlay"><span>Drop here</span><span id="dropIcon" class="gicon"></span></div>
  <div class="img-lightbox" id="imgLightbox" hidden><img></div>

  <script src="lib/CSInterface.js"></script>
  <script src="lib/marked.min.js"></script>
  <script src="icons.js"></script>
  <script src="main.js"></script>
</body>
</html>
